    description: Security definition MUST NOT use `basic` as type.
    message: '{{description}} {{error}} {{path}} {{property}}'
    severity: warn
    formats:
      - oas3
      - oas2
    given:
      - $.components.securitySchemes[*]
      - $.securityDefinitions[*]
    then:
      - field: type
        function: pattern
        functionOptions:
          notMatch: basic
      - field: scheme
        function: pattern
        functionOptions:
          notMatch: basic
  security-defined-oas2:
    description: Security definitions MUST be defined.
    message: '{{description}} {{error}} {{path}} {{property}}'
    severity: warn
    formats:
      - oas2
    given: $.
    then:
      field: securityDefinitions
      function: truthy
  security-defined-oas3:
    description: Security schemes MUST be defined.
    message: '{{description}} {{error}} {{path}} {{property}}'
    severity: warn
    formats:
      - oas3
    given: $.components.
    then:
      field: securitySchemes
      function: truthy
  security-global:
    description: Global security MUST be defined.
    message: '{{description}} {{error}} {{path}} {{property}}'
    severity: warn
    formats:
      - oas3
      - oas2
    given: $.
    then:
      - field: security
        function: truthy

    formats:
      - oas3
    given:
      - $.components.securitySchemes.*.flows
    then:
      - field: clientCredentials
        function: truthy
      - field: clientCredentials.tokenUrl
        function: truthy
      - field: clientCredentials.scopes
        function: truthy
  security-defined-ClientCredentialFlow-oas2:
    description: >-

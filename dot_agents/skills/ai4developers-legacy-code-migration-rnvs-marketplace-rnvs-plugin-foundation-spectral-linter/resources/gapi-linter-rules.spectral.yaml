  data-date-format:
    description: >-
      Date, Date-Time and Time fields must be of OAS format `date`, `date-time`
      or `time` compliant to RFC3339.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - >-
        $.definitions.*.properties[?(@property.match(/(^(([dD]ateOf)|([a-zA-Z]*DateOf))|[D][aA][tT][eE]\b)/)
        && @.type === 'string')]
      - >-
        $.definitions.*.properties[?(@property.match(/(^(([tT]imeOf)|([a-zA-Z]*TimeOf))|[T][iI][mM][eE]\b)/)
        && @.type === 'string')]
      - >-
        $.components.*.*.properties[?(@property.match(/(^(([dD]ateOf)|([a-zA-Z]*DateOf))|[D][aA][tT][eE]\b)/)
        && @.type === 'string')]
      - >-
        $.components.*.*.properties[?(@property.match(/(^(([tT]imeOf)|([a-zA-Z]*TimeOf))|[T][iI][mM][eE]\b)/)
        && @.type === 'string')]
    then:
      - field: format
        function: truthy
      - field: format
        function: pattern
        functionOptions:
          match: date-time|date|time
  info-contact-email-name:
    description: >-
      Object 'info.contact' MUST have 'email' (with regular email format).
      Property 'url' and 'name' COULD be used also.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: error
    formats:
      - oas2
      - oas3
    given: $.info.contact
    then:
      - field: email
        function: truthy
      - field: email
        function: pattern
        functionOptions:
          match: ^([A-Za-z0-9._%+-]{3,})+@([A-Za-z0-9.-]{3,})+\.[A-Za-z]{2,3}$
  info-version:
    description: >-
      Info `version` MUST be in strict SemVer format: MAJOR.MINOR.PATCH, all
      parts non-negative integers.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: error
    formats:
      - oas2
      - oas3
    given: $
    then:
      field: info.version
      function: pattern
      functionOptions:
        match: (^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$)
  info-title:
    description: >-
      Info `title` MUST be defined with at most 48 characters and no
      punctuations. The title is the API's name displayed in the API Catalog.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: error
    formats:
      - oas2
      - oas3
    given: $
    then:
      - field: info.title
        function: truthy
      - field: info.title
        function: length
        functionOptions:
          max: 48
      - field: summary
        function: pattern
        functionOptions:
          notMatch: \.
  info-description-format:
    description: >-
      Info `description` MUST be defined with at least 64 characters. The first
      384 characters are shown on the API Catalog main page, the rest only on
      the API`s detail page.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: error
    formats:
      - oas2
      - oas3
    given: $
    then:
      - field: info.description
        function: truthy
      - field: info.description
        function: length
        functionOptions:
          min: 64
  info-x-api-category-deprecated:
    description: >-
      Old values like ENTEPRISE or SYSTEM (or similar notations) are prohibited
      for 'info.x-api-category'!
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: error
    formats:
      - oas2
      - oas3
    given: $
    then:
      - field: info.x-api-category
        function: pattern
        functionOptions:
          notMatch: ^SYSTEM|^ENTERPRISE|^enterprise|^systems|^Enterprise|^System
  info-x-standard-reference-id:
    description: >-
      BLOCKING in Q1/2026: Please provide info (info.x-standard-reference &
      info.x-standard-reference.id) on which standard API your API is based,
      e.g. id=TMF622 incl. version in SemVer format: MAJOR.MINOR.PATCH or NONE.
      If the API is not standard-based, use `NONE` for id and version instead.
      You can also use other standards like SCIM2|CAMARA|MEF|IETF|GSMA|3GPP.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: $.info
    then:
      - field: x-standard-reference
        function: truthy
      - field: x-standard-reference.id
        function: truthy
      - field: x-standard-reference.id
        function: pattern
        functionOptions:
          match: (^(TMF\d{3}|SCIM2|CAMARA|MEF|IETF|GSMA|3GPP|NONE)$)
  info-x-standard-reference-version:
    description: >-
      Missing or wrong version format (SemVer): MAJOR.MINOR.PATCH or NONE on
      which standard API your API is based. If the Standard has no version, use
      `NONE` for version instead.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: $.info.x-standard-reference
    then:
      - field: version
        function: truthy
      - field: version
        function: pattern
        functionOptions:
          match: (^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)|NONE)$)
  info-x-segment:
    description: >-
      Info `x-segment` COULD be defined as an array of unique Strings, e.g.
      [B2B] or [B2B, B2C].  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/documentation
      and please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/api-areas
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: info
    formats:
      - oas2
      - oas3
    given: $.info
    then:
      - field: x-segment
        function: truthy
      - field: x-segment
        function: schema
        functionOptions:
          schema:
            type: array
            items:
              type: string
            minItems: 1
            uniqueItems: true
  info-x-application-schema:
    description: >-
      Info `x-application` SHOULD be defined as a String with minLength=3, e.g.
      "FxP" or "FlexProd".  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/documentation
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    type: style
    given: $.info
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          properties:
            x-application:
              type: string
              minLength: 3
  info-x-local-schema:
    description: >-
      Info `x-local` SHOULD be defined as an array of Strings, e.g. [BNG] or
      [BNG, MF].  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/documentation
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    type: style
    given: $.info
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          properties:
            x-local:
              type: array
              items:
                type: string
              minItems: 1
              uniqueItems: true
  info-x-api-category:
    description: >-
      Please enter category of API in "info.x-api-category": 'G-API', 'M-API',
      'DT Technik', 'T-Systems', 'TARDIS', 'other' etc. For more categories.
      Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/documentation
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: error
    formats:
      - oas2
      - oas3
    given: $
    then:
      - field: info.x-api-category
        function: truthy
      - field: info.x-api-category
        function: enumeration
        functionOptions:
          values:
            - G-API
            - M-API
            - DT Technik
            - T-Systems
            - TARDIS
            - TEST
            - INFRASTRUCTURE
            - congstar
            - DT IoT
            - DT Security
            - DT Service
            - GHS
            - other
  info-x-mira-capability:
    description: >-
      The field `x-mira-capability` should be present if `x-api-category` is not
      "DT Technik".  Info `x-mira-capability` SHOULD be defined as an array of
      unique Strings, e.g. ["MIRA 2 / Product Domain / Product Catalogue"] or
      ["MIRA 2 / Product Domain / Product Catalogue", "MIRA 2 / Product Domain /
      Product Configuration Management"].  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/documentation
      and please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/mira-mapping
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    type: style
    given: $.info
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          if:
            properties:
              x-api-category:
                not:
                  const: DT Technik
          then:
            properties:
              x-mira-capability:
                type: array
                items:
                  type: string
                minItems: 1
                uniqueItems: true
            required:
              - x-mira-capability
  info-x-mira2-capability:
    description: >-
      BLOCKING in Q1/2026: The field `x-mira-capability` should have values
      starting with 'MIRA 2 /'. Info `x-mira-capability` SHOULD be defined as an
      array of unique Strings, e.g. ["MIRA 2 / Product Domain / Product
      Catalogue"] or ["MIRA 2 / Product Domain / Product Catalogue", "MIRA 2 /
      Product Domain / Product Configuration Management"].  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/documentation
      and please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/mira-mapping
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    type: style
    given: $.info
    severity: info
    then:
      function: schema
      functionOptions:
        schema:
          properties:
            x-mira-capability:
              type: array
              items:
                type: string
                pattern: ^MIRA 2 \/
              minItems: 1
              uniqueItems: true
  info-x-mira1-capability-deprecated:
    description: >-
      BLOCKING in Q1/2026: Mira 1 is deprecated. Please use Mira 2.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/mira-mapping
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    type: style
    given: $.info
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          properties:
            x-mira-capability:
              type: array
              items:
                type: string
                pattern: ^(?!([mM][iI][rR][aA] 1))
  externalDocs:
    description: >-
      externalDocs COULD be use for some external documentation. Provide a
      description and an url.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: info
    formats:
      - oas2
      - oas3
    given: $
    then:
      - field: externalDocs
        function: truthy
      - field: $.externalDocs.description
        function: truthy
      - field: $.externalDocs.url
        function: truthy
  no-external-refs:
    description: >-
      No $ref references to external YAML files are allowed because RoverCLI
      does not support this feature!  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/basics/api-specification
    message: '{{description}} {{error}} {{path}} {{property}}'
    severity: error
    resolved: false
    formats:
      - oas2
      - oas3
    given: $..$ref
    then:
      function: pattern
      functionOptions:
        match: ^#/
  naming-operations:
    description: Operation `operationId` MUST be written in lowerCamelCase.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: >-
      $.paths.*[?( @property === 'get' || @property === 'put' || @property ===
      'post' || @property === 'delete' || @property === 'options' || @property
      === 'head' || @property === 'patch' || @property === 'trace' )]
    then:
      - field: operationId
        function: casing
        functionOptions:
          type: camel
      - field: operationId
        function: truthy
  naming-paths:
    description: Path names MUST be written in lowerCamelCase.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: ^(\/[a-z]+[a-zA-Z0-9]*|.{[a-zA-Z0-9]+})*$
  naming-properties-oas2:
    description: >-
      Property names MUST be written in lowerCamelCase (no special/symbol
      characters). Exceptions: _links, last_page, @baseType, @type,
      @schemaLocation, @valueSchemaLocation, @referredType.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
    given: $.definitions.*.properties.*~
    then:
      function: pattern
      functionOptions:
        match: >-
          ^(_links|last_page|@type|@baseType|@.{1,6}chemaLocation|@referredType|[a-z][a-z0-9]*([A-Z][a-z0-9]+)*[A-Z]?)$
  naming-properties-oas3:
    description: >-
      Property names MUST be written in lowerCamelCase (no special/symbol
      characters). Exceptions: _links, last_page, @baseType, @type,
      @schemaLocation, @valueSchemaLocation, @referredType.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas3
    given: $.components.schemas.*.properties.*~
    then:
      function: pattern
      functionOptions:
        match: >-
          ^(_links|last_page|@type|@baseType|@.{1,6}chemaLocation|@referredType|[a-z][a-z0-9]*([A-Z][a-z0-9]+)*[A-Z]?)$
  naming-schema-oas2:
    description: >-
      Schema names MUST be written in UpperCamelCase (no special/symbol
      characters). Postfixes '_Create' or '_Update' are allowed.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
    given: $.definitions.*~
    then:
      function: pattern
      functionOptions:
        match: ^(_links|([A-Z]+[a-z0-9]+)*(_Create|_Update)?$)
  naming-schema-oas3:
    description: >-
      Schema names MUST be written in UpperCamelCase (no special/symbol
      characters).  Postfixes '_Create' or '_Update' are allowed.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas3
    given: $.components.schemas.*~
    then:
      function: pattern
      functionOptions:
        match: ^(_links|([A-Z]+[a-z0-9]+)*(_Create|_Update)?$)
  operation-description-format:
    description: Operation `description` must be defined with at least 64 characters.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: >-
      $.paths.*[?( @property === 'get' || @property === 'put' || @property ===
      'post' || @property === 'delete' || @property === 'options' || @property
      === 'head' || @property === 'patch' || @property === 'trace' )]
    then:
      - field: description
        function: length
        functionOptions:
          min: 64
      - field: description
        function: truthy
  operation-summary:
    description: >-
      Operation `summary` MUST be defined with at most 64 characters and no
      punctuations.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: >-
      $.paths.*[?( @property === 'get' || @property === 'put' || @property ===
      'post' || @property === 'delete' || @property === 'options' || @property
      === 'head' || @property === 'patch' || @property === 'trace' )]
    then:
      - field: summary
        function: pattern
        functionOptions:
          notMatch: \.
      - field: summary
        function: length
        functionOptions:
          max: 64
      - field: summary
        function: truthy
  operation-operationId-format:
    description: Operation `operationId` MUST be defined in lowerCamelCase.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: >-
      $.paths.*[?( @property === 'get' || @property === 'put' || @property ===
      'post' || @property === 'delete' || @property === 'options' || @property
      === 'head' || @property === 'patch' || @property === 'trace' )]
    then:
      - field: operationId
        function: pattern
        functionOptions:
          match: ^[a-z][a-zA-Z0-9]*$
      - field: operationId
        function: truthy
  operation-parameters-path:
    description: Operation parameters names in `path` MUST use lowerCamelCase.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: $.paths.*..*[?(@.in ==='path')].name
    then:
      function: casing
      functionOptions:
        type: camel
  operation-parameters-header:
    description: Operation parameters names in `header` MUST use Hyphenated-Pascal-Case.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: $.paths.*..*[?(@.in ==='header')].name
    then:
      function: pattern
      functionOptions:
        match: ^[A-Z](?:[A-Z0-9]*[a-z]*|ID)*(?:-[A-Z](?:[A-Z0-9]*[a-z]*|ID)*)*$
  operation-responses-header:
    description: Operation response header names MUST use Hyphenated-Pascal-Case.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: $.paths.[*].responses.*.headers.
    then:
      field: '@key'
      function: pattern
      functionOptions:
        match: ^[A-Z](?:[A-Z0-9]*[a-z]*|ID)*(?:-[A-Z](?:[A-Z0-9]*[a-z]*|ID)*)*$
  operation-parameters-query:
    description: >-
      Operation parameters names in `query` MUST use lowerCamelCase (no
      special/symbol characters). Exceptions: @baseType, @type, @schemaLocation,
      @valueSchemaLocation, @referredType and nesting is expressed by a `.` as
      separator.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: $.paths.*..*[?(@.in ==='query')].name
    then:
      function: pattern
      functionOptions:
        match: >-
          ^(([a-z][a-zA-Z0-9]*\.)*((@(type|baseType|schemaLocation|valueSchemaLocation|referredType))|([a-z][a-zA-Z0-9]*)))$
  pagination-header-for-pagination-not-used:
    description: >-
      Pagination header 'X-Result-Count' not defined in Get request. Please
      implement Pagination in your Get request. Offset-Based-Pagination is
      recommended.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/technical/pagination/#offset-based-paging
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - >-
        $.paths[?(@property.match('^(?!.*(\/{.+})).*$'))].get.responses[?(@property.match(/^(200)/))]
    then:
      function: schema
      functionOptions:
        schema:
          required:
            - headers
          properties:
            headers:
              required:
                - X-Result-Count
  pagination-header-for-Offset-based-pagination-not-used:
    description: >-
      Pagination header 'X-Total-Count' not defined in Get request. Please
      implement Offset-Based-Pagination in your Get request.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/technical/pagination/#offset-based-paging
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - >-
        $.paths[?(@property.match('^(?!.*(\/{.+})).*$'))].get.responses[?(@property.match(/^(200)/))]
    then:
      function: schema
      functionOptions:
        schema:
          required:
            - headers
          properties:
            headers:
              required:
                - X-Total-Count
  pagination-paging-def-wrong:
    description: >-
      `Paging` object definition wrong. For Offset-based-Pagination, properties
      `total`, `page` and `last_page` are required and also declared as
      required, all of `type: integer`.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/technical/pagination/#offset-based-paging
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - $.components.schemas[?(@property.match("^Paging|^paging"))]
      - $.definitions[?(@property.match("^Paging|^paging"))]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            description:
              type: string
              minLength: 5
            type:
              type: string
              enum:
                - object
            properties:
              type: object
              properties:
                total:
                  type: object
                  properties:
                    description:
                      type: string
                      minLength: 5
                    type:
                      type: string
                      enum:
                        - integer
                  required:
                    - type
                page:
                  type: object
                  properties:
                    description:
                      type: string
                      minLength: 5
                    type:
                      type: string
                      enum:
                        - integer
                  required:
                    - type
                last_page:
                  type: object
                  properties:
                    description:
                      type: string
                      minLength: 5
                    type:
                      type: string
                      enum:
                        - integer
                  required:
                    - type
              required:
                - total
                - page
                - last_page
            required:
              type: array
              minItems: 3
              allOf:
                - contains:
                    type: string
                    const: total
                - contains:
                    type: string
                    const: page
                - contains:
                    type: string
                    const: last_page
                - contains:
                    minContains: 0
                    type: string
          required:
            - type
            - properties
            - required
  pagination-links-def-wrong:
    description: >-
      `Links`/`_links` object definition wrong. For Offset-based-Pagination,
      properties `first`, `self` and `last` are required and also declared as
      required, `next` and `prev` are optional, all of `type: string` & `format:
      uri`.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/technical/pagination/#offset-based-paging
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - $.components.schemas[?(@property.match("^_links|^Links"))]
      - $.definitions[?(@property.match("^_links|^Links"))]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            description:
              type: string
              minLength: 5
            type:
              type: string
              enum:
                - object
            required:
              type: array
              minItems: 3
              allOf:
                - contains:
                    type: string
                    const: first
                - contains:
                    type: string
                    const: self
                - contains:
                    type: string
                    const: last
                - contains:
                    minContains: 0
                    type: string
            properties:
              type: object
              properties:
                first:
                  type: object
                  properties:
                    description:
                      type: string
                      minLength: 5
                    type:
                      type: string
                      enum:
                        - string
                    format:
                      type: string
                      enum:
                        - uri
                  required:
                    - type
                    - format
                self:
                  type: object
                  properties:
                    description:
                      type: string
                      minLength: 5
                    type:
                      type: string
                      enum:
                        - string
                    format:
                      type: string
                      enum:
                        - uri
                  required:
                    - type
                    - format
                next:
                  type: object
                  properties:
                    description:
                      type: string
                      minLength: 5
                    type:
                      type: string
                      enum:
                        - string
                    format:
                      type: string
                      enum:
                        - uri
                  required:
                    - type
                    - format
                prev:
                  type: object
                  properties:
                    description:
                      type: string
                      minLength: 5
                    type:
                      type: string
                      enum:
                        - string
                    format:
                      type: string
                      enum:
                        - uri
                  required:
                    - type
                    - format
                last:
                  type: object
                  properties:
                    description:
                      type: string
                      minLength: 5
                    type:
                      type: string
                      enum:
                        - string
                    format:
                      type: string
                      enum:
                        - uri
                  required:
                    - type
                    - format
              required:
                - first
                - self
                - next
                - prev
                - last
          required:
            - type
            - properties
            - required
  pagination-headers-and-parameters-not-correct:
    description: >-
      For Pagination define parameters 'limit' and optional 'sort' in
      Get-request; For Offset-Based-Pagination define parameters 'offset',
      'limit' and optional 'sort'.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/technical/pagination/#offset-based-paging
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - $.paths[?(@property.match('^(?!.*(\/{.+})).*$'))].get
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            parameters:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
              uniqueItems: true
          if:
            properties:
              responses:
                type: object
                properties:
                  '200':
                    type: object
                    properties:
                      headers:
                        type: object
                        properties:
                          X-Total-Count:
                            type: object
                        required:
                          - X-Total-Count
          then:
            properties:
              parameters:
                type: array
                minItems: 2
                allOf:
                  - contains:
                      type: object
                      properties:
                        name:
                          type: string
                          const: limit
                  - contains:
                      type: object
                      properties:
                        name:
                          type: string
                          const: offset
                  - contains:
                      minContains: 0
                      type: object
                      properties:
                        name:
                          type: string
            required:
              - parameters
          else:
            properties:
              parameters:
                type: array
                minItems: 1
                allOf:
                  - contains:
                      type: object
                      properties:
                        name:
                          type: string
                          const: limit
                  - contains:
                      minContains: 0
                      type: object
                      properties:
                        name:
                          type: string
            required:
              - parameters
  pagination-headers-and-parameters-sort-missing:
    description: >-
      Pagination should have a 'sort' parameter.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/technical/pagination
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - >-
        $.paths[?(@property.match('^(?!.*(\/{.+})).*$'))][?(@property === 'get'
        || @property === 'head')]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            parameters:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
              uniqueItems: true
          if:
            properties:
              responses:
                type: object
                properties:
                  '200':
                    type: object
                    properties:
                      headers:
                        type: object
                        properties:
                          X-Total-Count:
                            type: object
                        required:
                          - X-Total-Count
          then:
            properties:
              parameters:
                type: array
                minItems: 2
                allOf:
                  - contains:
                      type: object
                      properties:
                        name:
                          type: string
                          const: sort
                  - contains:
                      minContains: 0
                      type: object
                      properties:
                        name:
                          type: string
          else:
            properties:
              parameters:
                type: array
                minItems: 1
                allOf:
                  - contains:
                      type: object
                      properties:
                        name:
                          type: string
                          const: sort
                  - contains:
                      minContains: 0
                      type: object
                      properties:
                        name:
                          type: string
            required:
              - parameters
  pagination-headers-and-parameters-not-correct-sort-wrong-def:
    description: >-
      The sort parameter for pagination should be defined either with 'required:
      true' or 'required: false' and with 'schema.default'.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/technical/pagination
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: >-
      $.paths[?(@property.match('^(?!.*(\/{.+})).*$'))][?(@property === 'get' ||
      @property === 'head')].parameters.[?(@.name === 'sort')]
    then:
      function: schema
      functionOptions:
        schema:
          oneOf:
            - type: object
              properties:
                name:
                  type: string
                  const: sort
                required:
                  type: boolean
                  const: false
                default:
                  type:
                    - array
                    - string
              required:
                - required
                - default
            - type: object
              properties:
                name:
                  type: string
                  const: sort
                required:
                  type: boolean
                  const: false
                schema:
                  type: object
                  properties:
                    default:
                      type:
                        - array
                        - string
                  required:
                    - default
              required:
                - required
                - schema
            - type: object
              properties:
                name:
                  type: string
                  const: sort
                required:
                  type: boolean
                  const: true
              required:
                - required
  path-keys-no-wildcard:
    description: Paths MUST NOT use wildcard character `*`.
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: $.paths
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: (.+\*$)|(\*.+)|(.+\*.+)$
  path-declarations-no-empty-object:
    description: >-
      BLOCKING from 1st October: Path declarations MUST exist and MUST NOT be an
      empty object. This is a violation of PSA-Requirement ID: 3.02-23/8.0.
      Please see http://psa.telekom.de!
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: error
    formats:
      - oas2
      - oas3
    given: $.paths
    then:
      field: $.*~
      function: truthy
  request-method:
    description: >-
      Operation request MUST only use allowed HTTP methods
      (get,post,put,patch,delete,head). Do NOT use options, servers, trace,
      connect or any x-extensions and try to avoid summary and description.
      Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-method/
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: error
    formats:
      - oas2
      - oas3
    given: $.paths.*
    then:
      field: '@key'
      function: pattern
      functionOptions:
        match: >-
          ^(get|post|put|patch|delete|head|parameters|summary|description|options|x-[a-zA-Z0-9-]+)$
  request-method-options:
    description: >-
      Do NOT use HTTP method options, it's not helpful in RESTful APIs. Try to
      avoid summary and description on path level, it's not helpful too.
      x-Extensions shouldn't be used, too.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-method/
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: $.paths.*
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: ^(summary|description|options|x-[a-zA-Z0-9-]+)$
  request-headers:
    description: >-
      Operation request MUST only use allowed HTTP request headers. Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-headers/
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - $.paths.*.*.parameters.[?(@.in == 'header')]
      - $.paths.*.parameters.[?(@.in == 'header')]
    then:
      field: name
      function: enumeration
      functionOptions:
        values:
          - Accept
          - Accept-Charset
          - Accept-Encoding
          - Accept-Language
          - Cache-Control
          - Content-Encoding
          - Content-Language
          - Content-Length
          - Date
          - Expect
          - If-Match
          - If-Modified-Since
          - If-None-Match
          - Prefer
          - X-Auth-Identity
          - X-B3-ParentSpanId
          - X-B3-ParentSpanID
          - X-B3-Sampled
          - X-B3-SpanId
          - X-B3-SpanID
          - X-B3-TraceId
          - X-B3-TraceID
          - X-Business-Context
          - X-Correlation-Id
          - X-Correlation-ID
          - X-Idempotency-Key
          - X-Request-Id
          - X-Request-ID
          - X-Subscription-Id
          - X-Subscription-ID
  request-mediatype-oas2:
    description: >-
      Operation request MUST only use allowed HTTP media types. Specifying the
      charset like "application/json;charset=UTF-8" is not necessary!
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - $.consumes.*
      - $.*.*.*.consumes.*
    then:
      function: enumeration
      functionOptions:
        values:
          - application/json
          - application/merge-patch+json
          - application/json-patch+json
          - application/json-patch-query+json
          - application/problem+json
  request-mediatype-oas3:
    description: >-
      Operation request MUST only use allowed HTTP media types. Specifying the
      charset like "application/json;charset=UTF-8" is not necessary!
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given: $.paths.*.*.*.content
    then:
      field: '@key'
      function: enumeration
      functionOptions:

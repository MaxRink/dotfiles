      - >-
        $.paths.*[?( @property
        !=='head')].responses[?(@property.match(/^(400|409|410|412|413|428|500|502|503|504)/))].
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            content:
              oneOf:
                - type: object
                  properties:
                    application/json:
                      type: object
                      properties:
                        schema:
                          oneOf:
                            - type: object
                              required:
                                - required
                              properties:
                                required:
                                  type: array
                                  minItems: 2
                                  items:
                                    enum:
                                      - code
                                      - reason
                            - type: object
                              required:
                                - allOf
                              properties:
                                allOf:
                                  type: array
                                  allOf:
                                    - contains:
                                        minContains: 1
                                        type: object
                                        required:
                                          - required
                                        properties:
                                          required:
                                            type: array
                                            minItems: 2
                                            items:
                                              enum:
                                                - code
                                                - reason
                      required:
                        - schema
                  required:
                    - application/json
                - type: object
                  properties:
                    application/problem+json:
                      type: object
                      properties:
                        schema:
                          oneOf:
                            - type: object
                              required:
                                - required
                              properties:
                                required:
                                  type: array
                                  minItems: 2
                                  items:
                                    enum:
                                      - type
                                      - title
                            - type: object
                              required:
                                - allOf
                              properties:
                                allOf:
                                  type: array
                                  allOf:
                                    - contains:
                                        minContains: 1
                                        type: object
                                        required:
                                          - required
                                        properties:
                                          required:
                                            type: array
                                            minItems: 2
                                            items:
                                              enum:
                                                - type
                                                - title
                      required:
                        - schema
                  required:
                    - application/problem+json
          required:
            - content

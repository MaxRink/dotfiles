  response-status-forbidden:
    description: >-
      Operation responses
      `203|206|207|300|301|302|303|307|308|402|405|406|408|410|411|414|416|418|421|426|501|502`
      MUST NOT be used.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-statuscode/

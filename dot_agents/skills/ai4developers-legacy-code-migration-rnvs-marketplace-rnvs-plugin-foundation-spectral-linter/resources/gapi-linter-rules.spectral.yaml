  response-status-with-no-payload:
    description: >-
      Operation responses `100|204|304|401|403|404|410|415|417|422|429` MUST NOT
      return a payload or declare a content or response media type.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-statuscode/
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - >-
        $.paths[*].*.responses[?(@property.match(/^(100|204|304|401|403|404|410|415|417|422|429)/))].content
      - >-
        $.paths[*].*.responses[?(@property.match(/^(100|204|304|401|403|404|410|415|417|422|429)/))].schema
    then:
      function: falsy
  response-content:
    description: >-
      Operation response MUST define a content type (OAS3) or schema (OAS2).
      Except for ``HEAD`` method.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-statuscode/
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - >-
        $.paths.*[?( @property
        !=='head')].responses[?(@property.match(/^(200|201|400|409|412|413|428|500|502|503|504)/))].
    then:
      function: xor
      functionOptions:
        properties:
          - schema
          - content
  response-content-produces-oas2:
    description: >-
      Operation response MUST define a content type.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-mediatype/
    message: '{{description}} {{error}} {{path}} {{property}}'

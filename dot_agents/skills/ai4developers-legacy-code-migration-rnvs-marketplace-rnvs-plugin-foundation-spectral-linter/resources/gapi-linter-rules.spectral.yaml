          properties:
            headers:
              type: object
              required:
                - X-Business-Context
              properties:
                X-Business-Context:
                  type: object
                  properties:
                    description:
                      type: string
                      minLength: 5
                    required:
                      type: boolean
                    schema:
                      required:
                        - type
                      properties:
                        type:
                          type: string
                          const: string
  response-headers-X-Business-Context-OAS2:

    message: '{{description}} {{error}} {{path}} {{property}}'
    severity: warn
    formats:
      - oas2
    given:
      - $.securityDefinitions.*
    then:
      - field: flow
        function: truthy
      - field: flow
        function: pattern
        functionOptions:
          match: ^application$

    description: >-
      Wrong type of security defined. Only type `oauth2` with fields `flows` and
      `description` is allowed.
    message: '{{description}} {{error}} {{path}} {{property}}'
    severity: warn
    formats:
      - oas3
    given:
      - $.components.securitySchemes.*.
    then:
      - field: flows
        function: truthy
      - field: description
        function: truthy
      - field: type
        function: truthy
      - field: type
        function: pattern
        functionOptions:
          match: ^oauth2$
  security-defined-oauth2-oas2:
    description: >-
      Wrong type of security defined. Only type `oauth2` with fields `flow` and
      `description` is allowed.
    message: '{{description}} {{error}} {{path}} {{property}}'
    severity: warn
    formats:
      - oas2
    given:
      - $.securityDefinitions.*.
    then:
      - field: flow
        function: truthy
      - field: description
        function: truthy
      - field: type
        function: truthy
      - field: type
        function: pattern
        functionOptions:
          match: ^oauth2$
  security-defined-ClientCredentialFlow-oas3:
    description: >-
      Only `clientCredentials` flow with `tokenUrl` and `scopes` is allowed by

    then:
      function: falsy
  response-mediatype-oas3:
    description: >-
      Operation response MUST only use allowed HTTP media types. Specifying the
      charset like "application/json;charset=UTF-8" is not necessary!  Please
      see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-statuscode/
      and
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-mediatype/
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas3
    given:
      - >-
        $.paths[*].*.responses[?(@property.match(/^(200|201|202|400|409|412|413|428|429|500|502|503|504)/))].content.*~
    then:
      function: enumeration
      functionOptions:
        values:
          - application/json
          - application/problem+json
  response-errorobject-mediatype-4xx-5xx-oas3:
    description: >-
      Operation response MUST return Error/Problem Details (except head method)
      and use `application/problem+json` media type for RFC9457 or media type
      `application/json` for TMF.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-statuscode/
      and
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/http-details/http-mediatype/
      and
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/models/error-message
    message: '{{description}} {{error}} {{path}} {{property}}'

  errorObject-def-missing:
    description: >-
      No Error object definition exists.  Please define object `Error` according
      to either RFC9457 or TMF definition.  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/models/error-message
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - $.components.schemas
      - $.definitions
    then:
      - field: Error
        function: truthy
  anyType-definition-found:
    description: >-
      ANY type found. Do NOT define and use the ANY type! The ANY type is
      forbidden to use!  Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/models/any-type
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
      - oas2
      - oas3
    given:
      - $.components.schemas
      - $.definitions
    then:
      - field: Any.type
        function: pattern
        functionOptions:
          notMatch: ^object
  errorObject-def-wrong:
    description: >-
      Please define object `Error` according to either RFC9457 (title, desc &
      req. properties: `type`(uri-reference), `title`; opt.: `status`,
      `details`, `instance`(uri-reference)) or TMF definition (title, desc &
      req. properties: `code`, `reason`; opt.: `message`, `status`,
      `referenceError`(uri), `@baseType`, `@schemaLocation`(uri), `@type`).
      Please see
      https://docs.devops.telekom.de/docs/standards-and-security/api-guidelines/models/error-message
    message: '{{description}} {{error}} {{path}} {{property}}'
    recommended: true
    severity: warn
    formats:
